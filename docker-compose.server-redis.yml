services:
  redis:
    image: redis:7.4-alpine
    container_name: ausbildungsdoku-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --save '' --appendonly no --dir /data --requirepass "1234"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"1234\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
